server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Frontend, VITE_API_BASE_URL=/v1 ile aynı origin (localhost:8080)
    # üzerinden API çağrıları yapar. Bu location olmadan POST/PUT/DELETE
    # gibi istekler nginx'in statik dosya sunucusuna düşer ve statik dosya
    # handler'ı sadece GET/HEAD desteklediği için "405 Not Allowed" döner.
    # Bu nedenle /v1/ altındaki tüm istekleri conference-web-api servisine
    # proxy'liyoruz.
    location /v1/ {
        proxy_pass http://conference-web-api:3000/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
